name = "jurisia-groq-proxy"
main = "src/index.js"
compatibility_date = "2026-08-25"

# La clé Groq n'est JAMAIS mise ici ni dans aucun fichier versionné : elle est
# fournie via un secret Cloudflare, voir README.md ("wrangler secret put").

# URL et clé publique du projet Supabase — servent au Worker à valider le
# jeton de l'appelant et à lire son offre d'abonnement (quotas par palier).
# Ce ne sont PAS des secrets : ces deux valeurs sont déjà embarquées dans le
# client (y compris la version web), leur exposition est sans risque — la
# sécurité des données vient des politiques RLS, pas de leur confidentialité.
# Sans ces variables, le Worker fonctionne normalement mais limite le débit
# par IP uniquement (comportement historique).
[vars]
SUPABASE_URL = "https://gfpguuuzzyqoxjkhlhli.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_zBehM1ZVTng4CoAnCn5xMw_ygbRmvGa"

# Compteurs de limitation de débit (anti-abus). Sans ce binding, le Worker
# continue de fonctionner mais sans limiter le débit — voir README.md pour
# créer le namespace et remplacer l'id ci-dessous.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6b90aa68ca7c4445ba4a430547a85de5"

# Workers Logs : persiste les console.log() du Worker (quelques jours de
# rétention côté Cloudflare) et les rend consultables/filtrables dans le
# tableau de bord (Workers & Pages > jurisia-groq-proxy > Logs), pour la
# supervision en production (voir README.md).
[observability]
enabled = true
