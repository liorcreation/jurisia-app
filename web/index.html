<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JurisIA — assistant juridique IA pour le Burkina Faso : litiges et consultations, bibliothèque juridique, espace étudiant, espace professionnel.">
  <meta name="theme-color" content="#071527">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JurisIA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JurisIA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
     * Voile de chargement affiché immédiatement, le temps que l'engine
     * Flutter se télécharge et s'initialise — il empêche tout flash blanc.
     * Volontairement SANS marque ni mot-symbole : le logo n'apparaît qu'une
     * seule fois, dans l'écran de démarrage animé de l'app (« Sceau
     * Radiant »). Ici, juste le fond signature et trois points d'or qui
     * respirent. Retiré dès que Flutter a peint sa première image
     * (événement `flutter-first-frame`).
     */
    html, body { margin: 0; padding: 0; height: 100%; background-color: #071527; }

    #jurisia-boot {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(1200px 700px at 84% 6%, rgba(201, 162, 39, 0.12), transparent 60%),
        radial-gradient(1200px 800px at 8% 96%, rgba(46, 111, 242, 0.10), transparent 60%),
        linear-gradient(180deg, #071527 0%, #0B1F3A 100%);
      opacity: 1;
      transition: opacity 420ms ease;
    }

    #jurisia-boot.jurisia-boot--hidden {
      opacity: 0;
      pointer-events: none;
    }

    #jurisia-boot .jurisia-boot__dots {
      display: flex;
      gap: 9px;
    }

    #jurisia-boot .jurisia-boot__dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #E9D48A;
      opacity: 0.35;
      animation: jurisia-boot-pulse 1400ms ease-in-out infinite;
    }

    #jurisia-boot .jurisia-boot__dots i:nth-child(2) { animation-delay: 180ms; }
    #jurisia-boot .jurisia-boot__dots i:nth-child(3) { animation-delay: 360ms; }

    @keyframes jurisia-boot-pulse {
      0%, 100% { opacity: 0.28; transform: scale(0.85); }
      50% { opacity: 0.95; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #jurisia-boot .jurisia-boot__dots i { animation: none; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div id="jurisia-boot" role="status" aria-label="Chargement de JurisIA">
    <div class="jurisia-boot__dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <script>
    (function () {
      var removed = false;
      function dismissBoot() {
        if (removed) return;
        removed = true;
        var boot = document.getElementById('jurisia-boot');
        if (!boot) return;
        boot.classList.add('jurisia-boot--hidden');
        window.setTimeout(function () {
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }, 500);
      }
      window.addEventListener('flutter-first-frame', dismissBoot);
      // Filet de sécurité : si l'événement n'arrive jamais (erreur d'init),
      // on ne laisse pas le loader bloqué indéfiniment à l'écran.
      window.setTimeout(dismissBoot, 12000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
