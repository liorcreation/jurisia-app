<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JurisIA — assistant juridique IA pour le Burkina Faso : litiges et consultations, bibliothèque juridique, espace étudiant, espace professionnel.">
  <meta name="theme-color" content="#071527">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JurisIA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JurisIA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
     * Aucun écran de chargement HTML : le seul écran de démarrage est
     * celui, animé, de l'app (« Sceau Radiant »). On donne juste au
     * document le même dégradé Bleu Nuit que ce sceau, pour que le court
     * instant où l'engine Flutter se télécharge soit un fond identique —
     * ni flash blanc, ni transition visible vers l'animation.
     */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #071527;
      background-image: linear-gradient(180deg, #071527 0%, #0B1F3A 100%);
      background-attachment: fixed;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
