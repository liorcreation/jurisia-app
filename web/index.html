<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JurisIA — assistant juridique IA pour le Burkina Faso : litiges et consultations, bibliothèque juridique, espace étudiant, espace professionnel.">
  <meta name="theme-color" content="#071527">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JurisIA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JurisIA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
     * Loader HTML/CSS affiché immédiatement, avant même le téléchargement et
     * l'initialisation de l'engine Flutter — plus aucun écran blanc au
     * premier chargement. Retiré par le script en pied de page dès que
     * Flutter a peint sa première image (événement `flutter-first-frame`).
     */
    html, body { margin: 0; padding: 0; height: 100%; background-color: #071527; }

    #jurisia-boot {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background:
        radial-gradient(760px 760px at 50% 46%, rgba(201, 162, 39, 0.10), transparent 62%),
        radial-gradient(1200px 700px at 84% 6%, rgba(201, 162, 39, 0.12), transparent 60%),
        radial-gradient(1200px 800px at 8% 96%, rgba(46, 111, 242, 0.10), transparent 60%),
        linear-gradient(180deg, #071527 0%, #0B1F3A 100%);
      opacity: 1;
      transition: opacity 460ms ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #jurisia-boot.jurisia-boot--hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Halo doux derrière la marque. */
    #jurisia-boot .jurisia-boot__mark {
      width: 96px;
      height: 96px;
      filter: drop-shadow(0 0 26px rgba(233, 212, 138, 0.28));
      animation: jurisia-boot-breathe 2600ms ease-in-out infinite;
    }

    #jurisia-boot .jurisia-boot__wordmark {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(115deg, #E9D48A 0%, #C9A227 45%, #8A6A15 60%, #E9D48A 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    #jurisia-boot .jurisia-boot__rule {
      width: 132px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C9A227, transparent);
      opacity: 0.7;
    }

    #jurisia-boot .jurisia-boot__tagline {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3.4px;
      color: #E9D48A;
      opacity: 0.75;
    }

    @keyframes jurisia-boot-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @media (prefers-reduced-motion: reduce) {
      #jurisia-boot .jurisia-boot__mark { animation: none; }
    }
  </style>
</head>
<body>
  <div id="jurisia-boot" role="status" aria-label="Chargement de JurisIA">
    <svg class="jurisia-boot__mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="jurisia-boot-gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E9D48A"/>
          <stop offset="0.5" stop-color="#C9A227"/>
          <stop offset="1" stop-color="#8A6A15"/>
        </linearGradient>
      </defs>
      <path fill="url(#jurisia-boot-gold)" d="M50,4 Q52.3,44.46 69.09,30.91 Q55.54,47.7 96,50 Q55.54,52.3 69.09,69.09 Q52.3,55.54 50,96 Q47.7,55.54 30.91,69.09 Q44.46,52.3 4,50 Q44.46,47.7 30.91,30.91 Q47.7,44.46 50,4 Z"/>
    </svg>
    <div class="jurisia-boot__wordmark">JurisIA</div>
    <div class="jurisia-boot__rule"></div>
    <div class="jurisia-boot__tagline">ASSISTANT JURIDIQUE</div>
  </div>

  <script>
    (function () {
      var removed = false;
      function dismissBoot() {
        if (removed) return;
        removed = true;
        var boot = document.getElementById('jurisia-boot');
        if (!boot) return;
        boot.classList.add('jurisia-boot--hidden');
        window.setTimeout(function () {
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }, 500);
      }
      window.addEventListener('flutter-first-frame', dismissBoot);
      // Filet de sécurité : si l'événement n'arrive jamais (erreur d'init),
      // on ne laisse pas le loader bloqué indéfiniment à l'écran.
      window.setTimeout(dismissBoot, 12000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
