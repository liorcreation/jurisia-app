name: CI

# Sur chaque push et pull request vers main : analyse statique, tests, et une
# compilation réelle sur deux plateformes pour attraper les régressions que
# `flutter analyze`/`flutter test` seuls ne voient pas (config native,
# assets manquants, etc.). iOS/macOS/Windows sont volontairement absents ici
# — les runners macOS/Windows de GitHub Actions coûtent nettement plus de
# minutes que ubuntu ; à ajouter si ce projet passe sur un plan payant ou
# que ces plateformes deviennent prioritaires.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.44.6'
  # Pas un secret (un DSN Sentry ne permet que d'ENVOYER des événements,
  # jamais de les lire) — voir lib/core/monitoring/crash_reporting.dart.
  SENTRY_DSN: 'https://95d9589cbac4e78a05502ce23d2cf937@o4512029762912256.ingest.de.sentry.io/4512029795156048'

jobs:
  analyze-and-test:
    name: Analyse & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter build apk --debug

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    env:
      # `secrets` n'est lisible dans un `if:` qu'au travers d'un `env:` de
      # job — tant que CLOUDFLARE_API_TOKEN n'est pas posé (Settings >
      # Secrets and variables > Actions), l'étape de déploiement est
      # SAUTÉE, jamais rouge : seule sa présence active le déploiement.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --dart-define=SENTRY_DSN=${{ env.SENTRY_DSN }}
      # Déploiement Cloudflare Pages — seulement sur main, jamais depuis une
      # pull request (le code n'est pas encore relu/mergé). CLOUDFLARE_API_TOKEN
      # est le seul secret à poser (Settings > Secrets and variables > Actions) ;
      # l'account id n'est pas un secret côté Cloudflare (visible dans le
      # tableau de bord), il peut rester en clair ici.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '965682a1a6bf1d0c3b4e9f3b6f634d5a'
          wranglerVersion: '4'
          command: pages deploy build/web --project-name=jurisia-app --branch=main

  build-admin-web:
    name: Build Admin Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # Console d'administration : point d'entrée séparé, jamais dans le
      # bundle grand public (lib/main.dart ne l'importe pas).
      - run: flutter build web --release -t lib/admin_main.dart --dart-define=SENTRY_DSN=${{ env.SENTRY_DSN }}
      # web/ est un dossier UNIQUE partagé par les deux cibles de build : sans
      # ce patch, l'onglet de l'admin afficherait le même titre que l'app
      # grand public (voir admin-and-subscription-plan dans les mémoires du
      # porteur).
      - run: sed -i 's|<title>JurisIA</title>|<title>JurisIA — Administration</title>|' build/web/index.html
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '965682a1a6bf1d0c3b4e9f3b6f634d5a'
          wranglerVersion: '4'
          command: pages deploy build/web --project-name=jurisia-admin --branch=main

  deploy-groq-proxy:
    name: Deploy Groq proxy Worker
    runs-on: ubuntu-latest
    needs: analyze-and-test
    # Condition du JOB lui-même : référence `secrets` directement (pas de
    # `env` de repli possible ici — un `env:` de job n'est pas encore résolu
    # au moment où la condition du job qui le porte est évaluée).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '965682a1a6bf1d0c3b4e9f3b6f634d5a'
          wranglerVersion: '4'
          workingDirectory: server/groq-proxy
          command: deploy
